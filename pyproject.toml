[project]
name = "aqi"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Sudhanshu Rajput", email = "sudhanshurajput.gd@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "python-dotenv>=1.2.3",
]

[project.scripts]
aqi = "aqi:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
    "SIM",
]
